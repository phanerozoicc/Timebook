name: Timebook
options:
  bundleIdPrefix: com.haozc
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 9SVLV5WMH6
    CODE_SIGN_STYLE: Automatic
targets:
  Timebook:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: TimebookWidget
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Timebook
        LSUIElement: true
        NSAppleEventsUsageDescription: "Timebook 需要读取浏览器当前标签页的网址，以便按网站统计你的时间。网址只保存在本机，不会上传。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.Timebook
        PRODUCT_NAME: Timebook
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TimebookWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Sources/Shared
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.Timebook.widget
        PRODUCT_NAME: TimebookWidget
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
  TimebookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Timebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.TimebookTests
        PRODUCT_NAME: TimebookTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Timebook:
    build:
      targets:
        Timebook: all
        TimebookWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimebookTests
