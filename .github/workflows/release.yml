name: release

# 打 v* tag 发布：Linux 打可安装 tar.gz，macOS 构建 Release 版 .app 并 ad-hoc
# 签名后 zip，双端产物附到同一个 GitHub Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo python3-cairo python3-dbus \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            libxss1 x11-utils libnotify-bin xvfb fonts-noto-cjk

      - name: Full test suite (release gate)
        run: xvfb-run -a python3 scripts/check.py

      - name: Package installable tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="Timebook-${VERSION}-linux-x86_64"
          mkdir -p dist
          tar --transform "s,^,${NAME}/,S" \
              --exclude='__pycache__' --exclude='*.pyc' \
              -czf "dist/${NAME}.tar.gz" \
              timebook assets packaging install.sh run.sh README.md
          tar -tzf "dist/${NAME}.tar.gz" | head -5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-package
          path: apps/linux/dist/*.tar.gz

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Release (unsigned, sign ad-hoc afterwards)
        run: |
          xcodegen generate
          xcodebuild -project Timebook.xcodeproj \
            -scheme Timebook \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc codesign app bundle
        run: |
          APP="build/Build/Products/Release/Timebook.app"
          APEX=$(find "$APP/Contents" -maxdepth 3 -name '*.appex' | head -1)
          if [ -n "$APEX" ]; then
            codesign --force --sign - --timestamp=none "$APEX"
          fi
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep "$APP"

      - name: Zip app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Build/Products/Release/Timebook.app"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Timebook-${VERSION}-macos.zip"
          unzip -l "dist/Timebook-${VERSION}-macos.zip" | head -5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package
          path: apps/macos/dist/*.zip

  publish:
    runs-on: ubuntu-latest
    needs: [linux, macos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Collect artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;
          ls -l release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > notes.md <<'EOF'
          时账 Timebook — 纯本地的屏幕时间统计 + 番茄钟（macOS + Linux 双端）

          ## 下载 / Downloads

          | 文件 | 平台 | 安装 |
          |---|---|---|
          | `Timebook-<版本>-macos.zip` | macOS 15+ | 解压得 `Timebook.app`，拖入「应用程序」 |
          | `Timebook-<版本>-linux-x86_64.tar.gz` | Linux（GTK4） | 解压后在目录里执行 `./install.sh` |

          ### macOS 说明

          本包为 **ad-hoc 签名、未经公证（notarization）**：首次打开若被 Gatekeeper
          拦截，请右键点 `Timebook.app` →「打开」，或到「系统设置 → 隐私与安全性」
          点「仍要打开」。

          ### Linux 说明

          零 pip 依赖，只需系统包（Debian/Ubuntu）：

          ```bash
          sudo apt install -y python3 python3-gi python3-gi-cairo python3-dbus \
                              gir1.2-gtk-4.0 gir1.2-adw-1 \
                              libxss1 x11-utils libnotify-bin
          ```

          数据全部留在本机（Linux：`~/.local/share/timebook/`；macOS：应用沙盒内），
          无账号、无联网、无遥测。

          ---
          首个双端正式版。功能与验证范围见各平台 README 与 `docs/testing.md`。
          EOF
          sed -i "s/<版本>/${TAG#v}/g" notes.md
          gh release create "$TAG" release/* \
            --title "时账 Timebook $TAG" \
            --notes-file notes.md \
            || gh release upload "$TAG" release/* --clobber
